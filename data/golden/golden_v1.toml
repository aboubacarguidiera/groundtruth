# Jeu de référence v1 : une question, et le passage du corpus qui y répond.
#
# Pour ajouter une question, copie un bloc [[questions]] et remplis :
#   id        numéro unique (q003, q004, ...)
#   category  type de question : definition, obligation, droits, sanction, delai, champ
#   question  formulée avec TES mots, comme un vrai utilisateur, sans recopier le texte de loi
#   doc       "rgpd" ou "ai_act"
#   ref       "art_17" pour l'article 17, "rct_26" pour le considérant 26
#   excerpt   une phrase copiée telle quelle depuis le texte, qui contient la réponse
#
# Après chaque ajout : python -I scripts/check_golden.py

[[questions]]
id = "q001"
category = "droits"
question = "Est-ce que je peux exiger d'une entreprise qu'elle supprime les informations qu'elle détient sur moi ?"
doc = "rgpd"
ref = "art_17"
excerpt = "La personne concernée a le droit d'obtenir du responsable du traitement l'effacement, dans les meilleurs délais, de données à caractère personnel la concernant"

[[questions]]
id = "q002"
category = "delai"
