name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Installer les dépendances
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev]"

      - name: Construire le corpus et vérifier les questions
        run: |
          python -I scripts/build_corpus.py
          python -I scripts/check_golden.py

      - name: Tests unitaires
        run: pytest

      - name: Garder le modèle d'embedding d'une exécution à l'autre
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-multilingual-e5-small

      - name: Le recall@10 ne doit pas baisser de plus d'un point
        run: python -m groundtruth.regression
